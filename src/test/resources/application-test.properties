# Test profile configuration for Spring Boot slice tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Flyway during fast JPA unit/slice tests (Hibernate generates schema)
spring.flyway.enabled=false

# In-memory Redis disabled during slice tests
spring.data.redis.repositories.enabled=false

# Virtual threads
spring.threads.virtual.enabled=true
